name: Check flight prices

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC); GitHub may start it a few minutes late
  workflow_dispatch: {}       # "Run workflow" button for a manual check

permissions:
  contents: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search prices and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m tracker.check

      - name: Save results
        if: always()
        run: |
          git config user.name "fare-bot"
          git config user.email "fare-bot@users.noreply.github.com"
          git add docs/data data
          git diff --cached --quiet && exit 0
          git commit -m "Prices $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --quiet
          git push
